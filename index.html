<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Tracker</title>
  </head>

  <body>
    <div id="app">
      <section id="search">
        <input type="text" id="searchInput" placeholder="Search..." />
      </section>
      <section id="balance">
        <p>Баланс</p>
        <span id="balance-counter">0</span>
      </section>
      <section id="statistics">
        <h2>Статистика</h2>

        <p>Доходы: <span id="total-income">0</span></p>
        <p>Расходы: <span id="total-expenses">0</span></p>

        <h3>Расходы по категориям</h3>
        <p>
          Еда:
          <span id="category-food">0</span>
          <span id="category-food-percent">0%</span>
        </p>

        <p>
          Транспорт:
          <span id="category-transport">0</span>
          <span id="category-transport-percent">0%</span>
        </p>

        <p>
          Развлечения:
          <span id="category-entertainment">0</span>
          <span id="category-entertainment-percent">0%</span>
        </p>

        <p>
          Жильё:
          <span id="category-housing">0</span>
          <span id="category-housing-percent">0%</span>
        </p>

        <p>
          Другое:
          <span id="category-other">0</span>
          <span id="category-other-percent">0%</span>
        </p>
      </section>

      <button type="button" id="addTransactionButton">
        Добавить транзакцию
      </button>

      <section>
        <h2>Транзакции</h2>
        <div id="transactionsList"></div>
      </section>

      <div class="modal hidden" data-modal="transaction">
        <div class="modal__content">
          <button type="button" class="modal__close" id="closeTransactionModal">
            ×
          </button>
          <form id="transactionForm">
            <div>
              <label>
                Тип
                <select name="type">
                  <option value="expense">Расход</option>
                  <option value="income">Доход</option>
                </select>
              </label>
            </div>

            <div>
              <label>
                Сумма
                <input
                  type="number"
                  name="amount"
                  min="0"
                  placeholder="Введите сумму"
                />
              </label>
            </div>

            <div>
              <label>
                Категория
                <select name="category">
                  <option value="food">Еда</option>
                  <option value="transport">Транспорт</option>
                  <option value="entertainment">Развлечения</option>
                  <option value="housing">Жильё</option>
                  <option value="other">Другое</option>
                </select>
              </label>
            </div>

            <div>
              <label>
                Описание
                <input type="text" name="description" />
              </label>
            </div>

            <div>
              <label>
                Дата
                <input type="date" name="date" id="date-modal" />
              </label>
            </div>

            <button type="submit">Добавить</button>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
